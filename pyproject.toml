[project]
name = "Scraper-Lib-RMP"
version = "0.3.0"
description = "Resilient parallel bulk file downloader: Ray-based workers, retry/backoff, incremental mode and atomic state tracking."
readme = "README.md"
license = "MIT"
authors = [{ name="Rodrigo Monteiro Pereira", email="rmonteiropereira1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "colorama>=0.4.6",
    "filelock>=3.18.0",
    "matplotlib>=3.10.1",
    "numpy>=1.26",
    "portalocker>=3.1.1",
    "ray>=2.44.1",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "tqdm>=4.67.1",
]

# `scraper` is the command documented in docs/cli.rst. Without this entry point
# that page described a binary that no installation ever produced.
[project.scripts]
scraper = "scraper_lib.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.6",
    "virtualenv>=20.30.0",
]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.2.3",
    "sphinx-argparse>=0.5.2",
    "sphinx-autodoc-typehints>=3.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

# Without this section setuptools falls back to flat-layout auto-discovery and
# the wheel drops ScraperLib.py, CustomLogger.py and a bare __init__.py at the
# ROOT of site-packages, squatting the global names `ScraperLib` and
# `CustomLogger`. Declaring the src-layout keeps everything under the single
# `scraper_lib` package.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
