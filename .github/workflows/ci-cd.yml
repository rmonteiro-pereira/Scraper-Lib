# Continuous integration — lint, test, and publish the docs site.
#
# This workflow deliberately does NOT release. It used to also bump the version,
# push a tag and publish to PyPI, which made it self-triggering: the bump pushed
# a commit to master with a GitHub App token, app-token pushes DO start
# workflows, and that started another bump. It ran ~every 95 seconds and only
# stopped when a push happened to fail. Releasing is manual and lives in
# release.yml.
name: CI/CD Pipeline

on:
  push:
    branches: [ master ] # Or your default branch
  pull_request:
    branches: [ master ] # Or your default branch
  workflow_dispatch:

# Least privilege: nothing here writes to the repository. `pages`/`id-token` are
# required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  test-lint-type-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' #saving minutes on gh actions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python "3.12"
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install uv
        uv venv .venv
        source .venv/bin/activate
        uv sync --all-groups
        uv pip install .

    - name: Lint with Ruff
      run: |
        uv run ruff check src tests

    # - name: Type check with Mypy
    #   run: |
    #     mypy src

    - name: Run tests with Pytest
      run: |
        uv run pytest tests

  build-docs:
    runs-on: ubuntu-latest
    needs: test-lint-type-build # Run only if tests pass
    if: github.ref == 'refs/heads/master' # Build docs only on master branch merge

    steps:
        - name: Checkout
          uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'
            
        - name: Build-docs
          run: |
            pip install uv
            uv venv .venv
            source .venv/bin/activate
            uv sync --all-groups
            uv pip install .
            cd docs && uv run sphinx-build -b html . _build/html
               
        - name: Setup Pages
          uses: actions/configure-pages@v5
            
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: 'docs/_build/html'  # Removed extra space
              
        - name: Deploy to GitHub Pages
          uses: actions/deploy-pages@v4
